name: "Setup Azure DevOps Infrastructure"

# Déclenchement STRICTEMENT manuel (aucun déclenchement automatique sur push)
on:
  workflow_dispatch:

jobs:
  configure-azure-devops:
    name: "Configure Board Columns & Init Repos"
    runs-on: ubuntu-latest
    # Sécurité renforcée : SEUL le propriétaire du repository peut exécuter ce workflow
    if: github.actor == github.repository_owner

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Synchroniser le Repo Git vers Azure DevOps Repos"
        run: |
          git push "https://${{ secrets.AZURE_DEVOPS_PAT }}@dev.azure.com/khalid-dataops/khalid-dataops/_git/khalid-dataops" HEAD:main --force

      - name: "Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Run Azure DevOps Setup Script"
        env:
          AZURE_DEVOPS_ORG: "khalid-dataops"
          AZURE_DEVOPS_PROJECT: "khalid-dataops"
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python scripts/setup_azure_devops.py
