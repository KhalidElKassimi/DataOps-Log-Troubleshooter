# Azure DevOps CI/CD Pipeline : Déploiement automatisé des Notebooks vers Azure Databricks
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - notebooks/*
      - scripts/deploy_to_databricks.py

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: DATABRICKS_HOST
    value: 'https://adb-7405615002700070.10.azuredatabricks.net'
  # Le secret DATABRICKS_TOKEN peut être défini dans Azure DevOps > Pipelines > Library / Variables

stages:
- stage: ValidateAndTest
  displayName: "Validation & Tests Unitaires PySpark (CI)"
  jobs:
  - job: LintAndValidate
    displayName: "Linting & Syntaxe PySpark"
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Activer Python 3.11'

    - script: |
        python -m pip install --upgrade pip
        # Validation de la compilation des scripts PySpark et Agent
        python -m py_compile notebooks/01_ingest_sales_pipeline.py
        python -m py_compile notebooks/02_troubleshooter_agent.py
        echo "✅ Tous les scripts PySpark et Agent sont syntaxiquement valides."
      displayName: 'Validation syntaxique des Notebooks'

- stage: DeployToDatabricks
  displayName: "Déploiement Continu vers Azure Databricks (CD)"
  dependsOn: ValidateAndTest
  condition: succeeded()
  jobs:
  - job: DeployNotebooks
    displayName: "Synchronisation des Notebooks vers /Shared"
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
      displayName: 'Activer Python 3.11'

    - script: |
        python scripts/deploy_to_databricks.py
      displayName: 'Databricks Workspace Sync'
      env:
        DATABRICKS_HOST: $(DATABRICKS_HOST)
        DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
        DATABRICKS_SILVER_SCHEMA: $(DATABRICKS_SILVER_SCHEMA)
        FOUNDRY_ENDPOINT: 'https://aifs-dataops-troubleshooter-dev-do3dh2.openai.azure.com/'
        AZURE_DEVOPS_ORG: 'khalid-dataops'
        AZURE_DEVOPS_PROJECT: 'khalid-dataops'
        AZURE_DEVOPS_PAT: $(AZURE_DEVOPS_PAT)
        FOUNDRY_API_KEY: $(FOUNDRY_API_KEY)
        OUTLOOK_LOGIC_APP_URL: $(OUTLOOK_LOGIC_APP_URL)
